@let p = project();
<article class="card project">
  <div class="project__top">
    <img class="project__icon" [src]="p.icon" [alt]="p.name + ' app icon'" width="72" height="72" loading="lazy" />
    <div class="project__text">
      <h2 class="project__name">
        <a [routerLink]="['/portfolio', p.slug]">{{ p.name }}</a>
      </h2>
      <p class="project__status">
        <span>{{ p.status }}</span>
        @if (p.secure) {
          <app-secure-badge />
        }
      </p>
      <p class="project__tagline">{{ p.tagline }}</p>
    </div>
  </div>
  <div class="chips">
    @for (s of p.stack; track s) {
      <span class="chip">{{ s }}</span>
    }
  </div>
  <div class="project__actions">
    <a class="project__summary-link" [routerLink]="['/portfolio', p.slug]">Read the summary →</a>
    <app-store-links [project]="p" />
  </div>
</article>
